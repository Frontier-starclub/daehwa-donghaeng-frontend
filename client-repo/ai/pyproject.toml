[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daehwa-ai"
version = "0.1.0"
description = "대화동행 AI 서비스 — 약봉투 OCR, DUR 조회, 말벗 대화 응답"
# 배포는 Dockerfile의 3.13에서 이뤄지지만, 개발 환경 편차를 흡수하기 위해 바닥을 3.11로 둔다.
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
