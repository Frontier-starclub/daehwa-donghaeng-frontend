name: daehwa-client

# AI 서비스 단독 실행용.
# 백엔드까지 함께 띄우려면 compose.integration.yaml 을 참고한다.
services:
  ai:
    build:
      context: ./ai
    environment:
      APP_ENV: development
      PROVIDER_MODE: ${AI_PROVIDER_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
    ports:
      - "8100:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8100/health/live')
      interval: 5s
      timeout: 3s
      retries: 10
