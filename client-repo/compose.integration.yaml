name: daehwa-integration

# 3자 통합 테스트용 — 백엔드 + DB + AI 서비스.
# workspace/daehwa-donghaeng 과 workspace/daehwa-donghaeng-frontend/client-repo 구조.
#
# 실행: docker compose -f compose.integration.yaml up --build --wait
# .env.example을 복사하고 실제 연결은 AI_PROVIDER_MODE=remote와 두 키를 설정한다.
# 키 없는 서버 간 확인에는 AI_PROVIDER_MODE=mock을 사용한다.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: frontier
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
    volumes:
      - integration-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier"]
      interval: 3s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: ./ai
    environment:
      APP_ENV: development
      PROVIDER_MODE: ${AI_PROVIDER_MODE:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_OCR_MODEL: ${GEMINI_OCR_MODEL:-gemini-3.8-flash}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      OCR_MODEL: ${OCR_MODEL:-claude-opus-5}
      CHAT_MODEL: ${CHAT_MODEL:-claude-opus-5}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8100/health/live')
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ${BACKEND_BUILD_CONTEXT:-../../daehwa-donghaeng/apps/backend}
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://frontier:frontier@db:5432/frontier
      # remote는 실제 AI 서비스로 HTTP 요청을 보낸다.
      # docs/contract/ai-service.md 참조.
      PROVIDER_MODE: ${PROVIDER_MODE:-${BACKEND_PROVIDER_MODE:-remote}}
      AI_SERVICE_URL: http://ai:8100
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-45}
    ports:
      - "8090:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  integration-postgres:
